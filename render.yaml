# One-click setup for Render.com (free plan works).
# Render reads this file when you connect the GitHub repository.
services:
  - type: web
    name: probilato
    runtime: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: probilato-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
