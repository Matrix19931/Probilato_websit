# One-click setup for Render.com (free plan works).
# Render reads this file when you connect the GitHub repository.
services:
  - type: web
    name: probilato
    runtime: node
    plan: free
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.ionos.de
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: support@probilato.com
      - key: SMTP_PASS
        sync: false
      - key: SUPPORT_INBOX
        value: support@probilato.com
    disk:
      name: probilato-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
